<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>校园失物招领小程序 · 原型总览</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 32px 56px; background: #EEF0F3; color: #1A1A1A;
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
  }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .desc { font-size: 13px; color: #666; margin-bottom: 28px; line-height: 1.8; }
  .desc b { color: #07C160; }
  .row { display: flex; gap: 26px; flex-wrap: wrap; align-items: flex-start; }
  .item { width: 375px; }
  .cap {
    font-size: 13px; font-weight: 600; margin-bottom: 10px; color: #333;
    display: flex; align-items: center; gap: 8px;
  }
  .cap i {
    font-style: normal; background: #07C160; color: #fff; font-size: 11px;
    padding: 2px 8px; border-radius: 10px; font-weight: 500;
  }
  .item img {
    display: block; width: 375px; height: 812px; background: #fff;
    border-radius: 14px; box-shadow: 0 6px 22px rgba(0,0,0,.13);
  }
  .flow { margin-top: 40px; font-size: 13px; color: #555; line-height: 2; }
  .flow code {
    background: #fff; padding: 3px 9px; border-radius: 6px; font-size: 12px;
    border: 1px solid #DDE1E6;
  }
</style>
</head>
<body>
  <h1>校园失物招领小程序 · 原型总览</h1>
  <div class="desc">
    共 <b>7 个页面</b>，尺寸 375 × 812（微信小程序标准）。<br>
    其中「发布成功」「搜索结果」为流程演示所需的补充页面；「我的发布」用于演示<b>修改信息状态</b>。
  </div>

  <div class="row" id="row"></div>

  <div class="flow">
    <b>三条基本流程：</b><br>
    ① 查看信息 → 查看详情：<code>01 首页</code> → <code>06 信息详情</code><br>
    ② 发布信息 → 发布成功：<code>02 发布信息</code> → <code>03 发布成功</code> → <code>07 我的发布</code><br>
    ③ 搜索物品 → 查看结果：<code>04 搜索页</code> → <code>05 搜索结果</code> → <code>06 信息详情</code>
  </div>

<script>
const LIST = [
  ["01-首页.svg",        "首页",        "入口"],
  ["02-发布信息.svg",    "发布信息",    "表单"],
  ["03-发布成功.svg",    "发布成功",    "反馈"],
  ["04-搜索页.svg",      "搜索页",      "输入态"],
  ["05-搜索结果.svg",    "搜索结果",    "结果态"],
  ["06-信息详情.svg",    "信息详情",    "详情"],
  ["07-我的发布.svg",    "我的发布",    "管理"]
];
document.getElementById("row").innerHTML = LIST.map(([f, t, tag]) =>
  `<div class="item">
     <div class="cap"><i>${tag}</i>${t}</div>
     <img src="svg/${encodeURIComponent(f)}" alt="${t}">
   </div>`).join("");
</script>
</body>
</html>
